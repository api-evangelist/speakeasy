description: Speakeasy provides an AI control plane platform that lets enterprises govern, secure, and observe AI agents, MCP servers, and Skills.
  The platform integrates with existing identity providers to assign permissioned identities to each agent and enforces policy in real time. It
  offers audit logs, compliance reporting, and deployment through existing MDM solutions for security, compliance, and AI enablement teams.

