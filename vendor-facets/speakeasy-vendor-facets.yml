  facet: contract_governance
  points: 4
  baseline_pass_rate: 0.0
- feature: code-samples-overlay
  check: examples_published
  layer: composite
  provider_must: Declare the page or repository carrying the generated snippets as a CodeSamples entry.
  catalog_pass_rate: 0.052
  facet: contract_quality
  points: 4
  baseline_pass_rate: 0.127
- feature: code-samples-overlay
  check: openapi_examples
  layer: agent_readiness
  grade: documented
  partial: true
  partial_note: >-
    x-codeSamples are SDK usage snippets, not request/response examples. The dimension reads examples
    first, so Speakeasy reaches only the Code Samples link fallback (0.25).
  points: 7
  baseline_pass_rate: 0.36
- feature: cli-generation
  check: agent_skills
  layer: agent_readiness
  credit: 0.25
  provider_must: Generate a CLI and publish its skills file where the catalog can find it.
  note: >-
    The skills.md is generated from the CLI's commands, not written by the provider, so it is the derived
    class.
  points: 5
  baseline_pass_rate: 0.236
- feature: mcp-generation
  check: mcp_server
  layer: agent_readiness
  grade: documented
  provider_must: >-
    Publish and declare the server. An npm or MCPB package run locally cannot be probed. Reaching `verified`
    means deploying it on a host the provider operates (a Cloudflare Worker, or Gram on a custom domain).
  note: >-
    Tools are generated per operation from the provider's own OpenAPI, so their shape should not cluster
    with other customers' as `platform`. A Gram server left on Gram's default URL is not on the provider's
    surface.
  points: 12
  baseline_pass_rate: 0.22
- feature: openapi-linter
  check: operations_summary_coverage
  layer: composite
  conditional: true
  condition: The linter reports missing summaries. The provider has to write them and republish.
  catalog_pass_rate: 0.879
  facet: contract_quality
  points: 6
  baseline_pass_rate: 0.933
  saturated: true
  saturated_note: >-
    93% of providers with a contract, docs and a reference already earn this; the vendor cannot move it
    for most of its buyers.
- feature: openapi-linter
  check: operations_operation_ids
  layer: composite
  conditional: true
  condition: >-
    Only when the provider fixes what the generation ruleset flags and publishes that contract. The linter
    does not rewrite the document.
  catalog_pass_rate: 0.827
  facet: contract_quality
  points: 4
  baseline_pass_rate: 0.918
  saturated: true
  saturated_note: >-
    92% of providers with a contract, docs and a reference already earn this; the vendor cannot move it
    for most of its buyers.
- feature: openapi-linter
  check: error_responses_documented
  layer: composite
  conditional: true
  condition: Only if the API really returns documented 4xx bodies. Linting cannot invent an error schema.
  catalog_pass_rate: 0.367
  facet: contract_quality
  points: 4
  baseline_pass_rate: 0.621
- feature: openapi-linter
  check: credentials_not_in_query
  layer: composite
  conditional: true
  condition: >-
    The owasp ruleset flags query-string credentials. Clearing it means changing how the API authenticates,
    not the document.
  catalog_pass_rate: 0.845
  facet: contract_quality
  points: 3
  baseline_pass_rate: 0.891
earns_nothing:
- feature: code-samples-overlay
  check: examples_present
  why: x-codeSamples are SDK snippets. The check counts request or response examples on operations.
- feature: sdk-retries
  check: idempotency
  layer: agent_readiness
  why: >-
    Retries reuse an idempotency header only when the contract already declares one. The SDK never adds
    one.
- feature: speakeasy-skills
  check: agent_skill_present
  why: The skills teach an agent to use Speakeasy. They describe nothing on the customer's API.
- feature: openapi-linter
  check: rules_present
  why: >-
    A .speakeasy/lint.yaml is private workflow configuration. The check reads a ruleset the provider publishes.
out_of_reach:
  checks:
  - portal_present
  - documentation_present
  - api_reference_present
  - llms_txt_published
  - change_log_present
  - status_page_present
  - rate_limits_documented
  - well_known_published
  - auth_clarity
  note: >-
    Speakeasy hosts no docs site; it feeds snippets to Scalar, Mintlify, ReadMe or Redocly. The llms.txt
    it generates belongs to a generated CLI, not to the provider's docs root.
unscored_practice:
- feature: terraform-generation
  why: A Terraform provider is a real, deployed integration surface that no check reads.
- feature: gram-hosting
  why: >-
    Gram's AI control plane (policy and identity for agents and MCP) governs consumption, not the provider's
    published surface.
- feature: sdk-retries
  why: The x-speakeasy-retries extension records retry behaviour in the OpenAPI, and no check reads it.
