# Vendor facets — Speakeasy. Generates SDKs, Terraform providers, CLIs and MCP servers from an
# OpenAPI, and hosts MCP servers through Gram. The headline: its lift is SDK and CLI pointers plus
# one rubric-visible contract artifact, the OpenAPI Overlay that carries its code samples. It
# publishes no docs site of its own, and its linter reports gaps without fixing them.
vendor: speakeasy
name: Speakeasy
website: https://www.speakeasy.com
areas:
- sdk-generation
registry_keys: []
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  Speakeasy moves Developer Ergonomics through SDKs in seven languages and a generated Go CLI, and each
  counts only once the provider declares it in apis.yml. It is one of the few vendors whose output is
  an OpenAPI Overlay (the x-codeSamples code-samples overlay), which scores overlay_published if the provider
  publishes it. Those code samples are SDK snippets, not request/response examples, so they earn nothing
  on examples_present and only the link fallback on openapi_examples. Its MCP servers, Terraform providers
  and retry logic look like the customer's own work, so the customer surface carries almost no Speakeasy
  fingerprint.
features:
- id: sdk-generation
  name: SDK generation
  description: >-
    Idiomatic SDKs for TypeScript, Python, Go, Java, C#, PHP and Ruby (Rust and C++ listed as coming soon).
  source: https://www.speakeasy.com/docs
  tier: paid
- id: sdk-retries
  name: SDK retries driven by x-speakeasy-retries
  description: >-
    Backoff retries configured in the OpenAPI. When an endpoint already defines an idempotency header,
    retries reuse the same key.
  source: https://www.speakeasy.com/docs/sdks/customize/runtime/retries
  tier: all
- id: code-samples-overlay
  name: Code samples delivered as an OpenAPI Overlay
  description: >-
    Generates x-codeSamples usage snippets for every operation as an Overlay document (code-samples.yaml)
    that docs platforms such as Scalar, Mintlify, ReadMe and Redocly render.
  source: https://www.speakeasy.com/docs/sdks/sdk-docs/code-samples/generate-code-samples
  tier: all
- id: code-samples-api
  name: Code Samples API
  description: An authenticated API that serves generated snippets. Enterprise only.
  source: https://www.speakeasy.com/docs/sdks/sdk-docs/code-samples/code-samples-api
  tier: enterprise
- id: sdk-docs-embedding
  name: SDK snippets embedded in partner docs
  description: >-
    Speakeasy does not host an API reference. It adds snippets to the spec for a third-party docs platform
    to render.
  source: https://www.speakeasy.com/blog/release-sdk-docs
  tier: all
- id: cli-generation
  name: CLI generation
  description: >-
    A Go (Cobra) CLI that wraps the generated Go SDK, with GoReleaser configs and install scripts, and
    an agent mode that ships llms.txt and a skills.md for the CLI.
  source: https://www.speakeasy.com/blog/release-cli-generation
  tier: unknown
- id: mcp-generation
  name: Standalone MCP server generation
  description: >-
    A TypeScript MCP server generated from the OpenAPI, distributed as an npm package, an MCPB bundle
    or a Cloudflare Worker config.
  source: https://www.speakeasy.com/docs/standalone-mcp/build-server
  tier: all
- id: gram-hosting
  name: Gram hosted MCP servers
  description: >-
    Hosts MCP toolsets generated from an uploaded OpenAPI, with a custom slug and, on request to support,
    a custom domain.
  source: https://www.speakeasy.com/docs/gram/host-mcp/deploy-mcp-server
  tier: paid
- id: terraform-generation
  name: Terraform provider generation
  description: Generates a Terraform provider from x-speakeasy-entity annotated OpenAPI operations.
  source: https://www.speakeasy.com/docs/terraform/create-terraform
  tier: paid
- id: openapi-linter
  name: OpenAPI linter
  description: >-
    90+ rules in five rulesets (speakeasy-recommended, speakeasy-generation, speakeasy-openapi, openapi-standard,
    owasp), configured in .speakeasy/lint.yaml. It reports issues and does not fix them.
  source: https://www.speakeasy.com/docs/sdks/prep-openapi/linting
  tier: all
- id: speakeasy-skills
  name: Speakeasy Agent Skills
  description: >-
    21 skills that teach coding agents to use Speakeasy (specs, SDKs, Terraform). They are not generated
    for the customer's API.
  source: https://www.speakeasy.com/docs/speakeasy-reference/skills/
  tier: open-source
maps:
- feature: sdk-generation
  check: sdk_count_1
  layer: composite
  provider_must: Publish a generated SDK and declare it as an SDK entry in apis.yml.
